name: Production deploy to Nectar
on:
  push:
    branches: [ deploy ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production  # Never run two deploys of the same environment at once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Production deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.NECTAR_IP }}
          username: ${{ secrets.NECTAR_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e  # Stop at the first failing command, so a broken deploy is not restarted
            cd assure-app/
            git pull origin deploy
            source ~/.venv/assure-app/bin/activate
            pip install -r requirements.txt -c constraints.txt
            bash scripts/sync_assets.sh /home/$USER/assure-test
            sudo systemctl restart assure-app.service
