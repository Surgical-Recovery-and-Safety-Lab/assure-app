[project]
name = "assure"
version = "1.6.0"  # Single source of truth, read by src/constants.py. Keep in sync with CHANGELOG.md
description = "Streamlit app for surgical risk prediction"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Surgical Recovery and Safety Lab" }]
dependencies = [
  "altair==6.0.0",
  "joblib==1.5.3",
  "medpipe==0.4.1",
  "numpy==2.5.4",
  "pandas==2.3.3",
  "requests==2.34.2",
  "streamlit==1.54.0",
  "vl-convert-python==1.9.0.post1",
  "weasyprint==68.1",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.0",
  "pandas-stubs==2.3.3.260113",  # Matches pandas 2.3.3
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.mypy]
explicit_package_bases = true  # src has no __init__.py

# These libraries ship no type information
[[tool.mypy.overrides]]
module = ["joblib", "weasyprint", "vl_convert"]
ignore_missing_imports = true

# The app runs from a checkout and is not packaged, so `pip install .` only
# installs the dependencies.
[tool.setuptools]
packages = []
